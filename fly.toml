# Fly.io config for the FinSight Flask API.
# Deploy:
#   fly launch --no-deploy        # first time (creates the app; keep this toml)
#   fly secrets set DATABASE_URL="<neon pooled url>" GROQ_API_KEY="<groq key>"
#   fly deploy
# The DB connection and LLM key are SECRETS (set via `fly secrets`), never in this file.

app = "finsight-api"
primary_region = "fra"   # Frankfurt — closest to Neon's eu-central-1

[build]

[env]
  PORT = "8080"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0   # scale to zero when idle (free-tier friendly)

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
